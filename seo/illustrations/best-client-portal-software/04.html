<!doctype html>
<html><head><meta charset="utf-8">
<meta name="alt" content="Illustration of a schematic three-year cost comparison with no figures: a SaaS portal line that starts low and gets steeper each time client users pass a plan limit, and a custom portal line that starts higher with the build and then stays nearly flat.">
<link rel="stylesheet" href="../_base.css">
<style>
  :root { --w: 1200px; --h: 640px; --bg: var(--blue-soft); }
  .chart { width: 1040px; height: 540px; padding: 20px 30px; }
  .chart .bar { font-weight: 700; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
  .chart .bar span { font-weight: 500; font-size: 16px; color: var(--mute); }
  svg { width: 100%; height: 440px; margin-top: 10px; }
  .ax { stroke: var(--ink); stroke-width: 3; fill: none; }
  .gl { stroke: var(--line); stroke-width: 2; }
  .saas { stroke: var(--red); stroke-width: 6; fill: none; stroke-linejoin: round; }
  .cust { stroke: var(--ink); stroke-width: 6; fill: none; stroke-linejoin: round; }
  text { font-family: 'Space Grotesk', sans-serif; font-size: 17px; fill: var(--ink); }
  .lab { font-weight: 700; font-size: 18px; }
  .mute { fill: var(--mute); font-size: 15px; }
</style></head>
<body>
<div class="window chart">
  <div class="bar">Cumulative cost, schematic<span>shape only, no figures</span></div>
  <svg viewBox="0 0 980 440">
    <line class="gl" x1="330" y1="20" x2="330" y2="390"/>
    <line class="gl" x1="600" y1="20" x2="600" y2="390"/>
    <line class="gl" x1="870" y1="20" x2="870" y2="390"/>
    <path class="ax" d="M 60 20 L 60 390 L 900 390"/>
    <text x="40" y="205" text-anchor="middle" class="mute" transform="rotate(-90 40 205)">cost to date</text>
    <text x="330" y="418" text-anchor="middle">Year 1</text>
    <text x="600" y="418" text-anchor="middle">Year 2</text>
    <text x="870" y="418" text-anchor="middle">Year 3</text>

    <!-- SaaS: per seat or per plan, slope steps up as client users pass plan limits -->
    <path class="saas" d="M 60 380 L 250 330 L 260 330 L 420 270 L 430 270 L 600 190 L 610 190 L 870 50"/>
    <circle cx="255" cy="330" r="6" fill="var(--red)"/><circle cx="425" cy="270" r="6" fill="var(--red)"/><circle cx="605" cy="190" r="6" fill="var(--red)"/>
    <text x="250" y="312" class="mute" text-anchor="end">next tier</text>
    <text x="420" y="252" class="mute" text-anchor="end">next tier</text>

    <!-- Custom: build cost up front, then hosting and maintenance -->
    <path class="cust" d="M 60 380 L 150 230 L 870 175"/>
    <text x="160" y="214" class="mute">the build</text>

    <text x="880" y="56" class="lab" fill="var(--red)" style="fill:var(--red)">SaaS portal</text>
    <text x="880" y="180" class="lab">Custom</text>
    <text x="510" y="150" class="mute" text-anchor="middle">hosting + maintenance</text>
  </svg>
</div>
</body></html>
