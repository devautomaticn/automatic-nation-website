name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # The scheduled half of publishing. `isLive` in src/lib/blog.ts hides any post
  # whose `published` date is still in the future, so a post approved today and
  # dated next Tuesday is committed now and simply not rendered yet. Nothing
  # else would ever make next Tuesday arrive: a static build only reflects the
  # moment it ran, and without this cron the post would wait for whatever
  # unrelated push happened to come next.
  #
  # 06:15 UTC is early in the UTC day (03:15 in Buenos Aires, before the US
  # morning), so a post dated D is live for the whole of D in every market this
  # site sells into. The minute is off the hour on purpose — GitHub queues the
  # :00 slot heavily and can delay a run by tens of minutes.
  #
  # GitHub disables cron on a repo with no commits for 60 days and emails the
  # owner. If posts stop appearing, check that before checking the dates.
  schedule:
    - cron: '15 6 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Must run here, before the deploy: it diffs the new sitemap against the
      # one still live. After deploy-pages the two are the same file.
      # The assignment is its own line on purpose: inside `echo "$(…)"` a
      # failing diff (missing key file) would be swallowed and the build pass.
      - id: indexnow
        run: |
          urls=$(node seo/indexnow.mjs diff)
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bing and the other IndexNow engines; Google is not one of them (see the
  # header of seo/indexnow.mjs). A failure here is a warning, never a failed
  # deploy — the site is already live by the time this runs.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: node seo/indexnow.mjs submit
        env:
          URLS: ${{ needs.build.outputs.indexnow }}
